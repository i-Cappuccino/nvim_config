# ─── Terminal & Color ────────────────────────────────────────────────────────
set -g  default-terminal   "tmux-256color"
set -ga terminal-overrides  ",xterm-256color:Tc"
set -ga terminal-overrides  ",alacritty:Tc"

set -sg escape-time 10
set -g  focus-events on

# ─── Core Settings ────────────────────────────────────────────────────────────
set -g history-limit 100000
set -g mouse on
setw -g mode-keys vi

set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# ─── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Reload ───────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "  Config reloaded!"

# ─── Splits (open in current directory) ───────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# ─── Pane Resizing (repeatable) ───────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Vim-Tmux Navigator ───────────────────────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

bind C-l send-keys 'C-l'

# ─── Copy Mode (vi-style) ─────────────────────────────────────────────────────
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# macOS: copy to system clipboard
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi y \
    send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel "pbcopy"
}

# Linux: uncomment whichever clipboard tool you have
# if-shell "uname | grep -q Linux" {
#   bind-key -T copy-mode-vi y \
#     send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# }

# ─── Window Navigation ────────────────────────────────────────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window

# ─── Session Management ───────────────────────────────────────────────────────
bind s choose-tree -Zs
bind $ command-prompt -I "#S" "rename-session '%%'"

# ─── Status Bar (TokyoNight Night colors) ─────────────────────────────────────
set -g status-position bottom
set -g status-style    "bg=#1a1b26 fg=#a9b1d6"
set -g status-left-length  30
set -g status-right-length 60

set -g status-left  "#[fg=#7aa2f7,bold]  #S #[fg=#414868]│ "
set -g status-right "#[fg=#565f89] %d %b  #[fg=#a9b1d6,bold]%H:%M"

set -g window-status-format         " #I #W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I #W "
set -g window-status-style          "fg=#565f89"
set -g window-status-current-style  "fg=#7aa2f7 bold"

# ─── Pane Borders ─────────────────────────────────────────────────────────────
set -g pane-border-style         "fg=#414868"
set -g pane-active-border-style  "fg=#7aa2f7"
set -g pane-border-lines         single

# ─── Messages ─────────────────────────────────────────────────────────────────
set -g message-style  "fg=#7aa2f7 bg=#1a1b26 bold"
set -g display-time   2000
